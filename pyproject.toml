[project]
name = "anime-tweet-bot"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
  "openai==1.109.1",
  "tweepy==4.17.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "openai==1.109.1",
    "tweepy==4.17.0",
]
# tweepy 4.17.0（最新）が oauthlib<4 を要求するが、GHSA-7984-qgvg-3j9c / GHSA-xpv3-w29h-x7cv /
# GHSA-hj66-6f7g-4r5v の修正は oauthlib 4.0.0 以降にしかない。4.0.0 の破壊的変更は
# サーバー側（provider）の実装だけで、tweepy が使うクライアント側の署名には及ばない。
# tweepy が oauthlib 4 を許容したら（tweepy/tweepy#2245）この override を消す。
override-dependencies = [
    "oauthlib>=4.0.0",
]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 120
select = ["E", "F", "W", "C"]
ignore = ["E501"]  # 長い行を無視する場合

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"] # 未使用インポートを許容
